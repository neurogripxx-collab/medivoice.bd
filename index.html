<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medivoice.bd - SGH Voice Prescription</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#e9eef5}
.header{background:#fff;padding:14px 18px;border-bottom:3px solid #0b5ed7;font-weight:800;color:#0b5ed7;font-size:18px}
.pad{max-width:920px;margin:12px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.sec{padding:16px;border-bottom:1px solid #eee}
.search{width:100%;padding:13px;border:1.5px solid #0b5ed7;border-radius:12px;outline:none;font-size:15px}
.item{padding:10px;background:#f0f6ff;margin:4px 0;border-radius:10px;cursor:pointer;border:1px solid #d0ddff}
.card{background:#f8fbff;padding:14px;border-radius:14px;border:1px solid #dce6ff}
.voiceBox{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #10b981;padding:16px;border-radius:14px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;color:#fff;background:#059669;margin-top:8px;font-size:15px}
</style>
</head>
<body>
<div class="header">Medivoice.bd • SGH Digital Prescription • Voice Guide</div>

<div class="pad">
<div class="sec" style="display:flex;justify-content:space-between"><b>Digital Prescription RX-2026-147</b><span>28 Sep 2026</span></div>

<div class="sec c" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card">
<h4>💊 মেডিসিন লিস্ট - স্মার্ট সার্চ</h4>
<input id="q" class="search" placeholder="Napa লিখুন - না থাকলে Enter এ অটো যোগ হবে">
<div id="list"></div>
<div style="margin-top:10px;display:flex;gap:6px">
<select id="dose" style="flex:1;padding:8px;border-radius:8px"><option>1+0+1</option><option>1+1+1</option><option>0+0+1</option><option>1+0+0</option><option>ইন্সুলিন 20 IU</option></select>
<select id="when" style="flex:1;padding:8px;border-radius:8px"><option value="ভাত খাওয়ার পরে">ভাত খাওয়ার পরে</option><option value="ভাত খাওয়ার 5 মিনিট আগে">ভাত খাওয়ার 5 মিনিট আগে</option><option value="নাস্তা করার 5 মিনিট আগে">নাস্তা করার 5 মিনিট আগে</option><option value="খালি পেটে">খালি পেটে</option><option value="ঘুমানোর আগে">ঘুমানোর আগে</option></select>
</div>
<table style="width:100%;margin-top:10px;font-size:14px"><tbody id="rxbody"></tbody></table>
</div>

<div class="card">
<h4>🧪 রিপোর্ট চেক - শুধু রোগ বলবে</h4>
<label style="display:block;background:#fff;padding:12px;border:2px dashed #f59e0b;border-radius:12px;text-align:center">📷 রিপোর্টের ছবি দিন<input type="file" hidden accept="image/*" onchange="scan(this)"></label>
<div id="report" style="margin-top:10px;font-weight:700;color:#b45309"></div>
</div>
</div>

<div class="sec voiceBox">
<h3>🔊 ডাঃ এর ভয়েস গাইড - রোগীকে বলে দিবে</h3>
<p style="font-size:13px;color:#065f46">ডাঃ যা লিখবে, রোগীকে সালাম দিয়ে সময় মতো আদর করে বলে দিবে</p>
<div id="voicePreview" style="background:#fff;padding:12px;border-radius:10px;margin:10px 0;font-size:14px;color:#333;min-height:60px">এখনো কোনো ওষুধ যোগ হয়নি</div>
<button class="btn" onclick="speakProfessional()">▶️ আসসালামু আলাইকুম মা, এখন শুনুন - ভয়েস গাইড</button>
<button class="btn" style="background:#0b5ed7" onclick="startAutoVoice()">⏰ অটো এলার্ম চালু - সময় হলে নিজে বলে দিবে</button>
<div id="alarmStatus" style="margin-top:8px;font-size:12px;color:#065f46"></div>
</div>

</div>

<script>
let meds=JSON.parse(localStorage.getItem('meds2')||'[]');
let baseMeds=["Napa 500mg","Seclo 20mg","Fexo 120mg","Azithrocin 500mg","Entacyd Plus","Maxpro 20mg","Gensulin 20 IU","Gensulin 30/70","Comet 500mg","Losectil 20mg"];
let q=document.getElementById('q'), list=document.getElementById('list'), rxbody=document.getElementById('rxbody');

q.addEventListener('input',()=>{let v=q.value.toLowerCase();if(!v){list.innerHTML='';return}let all=[...new Set([...baseMeds,...JSON.parse(localStorage.getItem('allMeds')||'[]')])];let f=all.filter(m=>m.toLowerCase().includes(v)).slice(0,6);list.innerHTML=f.map(m=>`<div class="item" onclick="add('${m}')">${m}</div>`).join('');});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){let v=q.value.trim();if(!v)return;let all=JSON.parse(localStorage.getItem('allMeds')||'[]');if(!all.includes(v)){all.push(v);localStorage.setItem('allMeds',JSON.stringify(all));}add(v);}});

function add(name){let dose=document.getElementById('dose').value, when=document.getElementById('when').value; meds.push({name,dose,when,time:new Date().toLocaleTimeString()}); localStorage.setItem('meds2',JSON.stringify(meds)); render(); q.value=''; list.innerHTML='';}
function render(){rxbody.innerHTML=meds.map((m,i)=>`<tr style="border-bottom:1px solid #eee"><td style="padding:8px">💊 ${m.name}<br><small>${m.dose} - ${m.when}</small></td><td><span onclick="meds.splice(${i},1);localStorage.setItem('meds2',JSON.stringify(meds));render();updatePreview()" style="color:red;cursor:pointer">✕</span></td></tr>`).join(''); updatePreview();}
function updatePreview(){
 if(meds.length==0){document.getElementById('voicePreview').innerHTML='এখনো কোনো ওষুধ যোগ হয়নি';return}
 let txt=''; meds.forEach(m=>{
  if(m.name.toLowerCase().includes('gensulin')||m.name.toLowerCase().includes('insulin')){
   txt+=`• ${m.when} ${m.name} নিয়ে নিন। `;
  } else {
   txt+=`• ${m.when} ${m.name} ${m.dose} খাবেন। `;
  }
 });
 document.getElementById('voicePreview').innerHTML=txt;
}

function speakProfessional(){
 if(meds.length==0)return alert('আগে ওষুধ যোগ করুন');
 let hour=new Date().getHours(); let greet=hour<12?'সকাল':hour<18?'দুপুর':'রাত';
 let full=`আসসালামু আলাইকুম মা। এখন ${greet} ${new Date().toLocaleTimeString('bn-BD',{hour:'numeric',minute:'numeric'})} বাজে। `;
 meds.forEach(m=>{
  if(m.name.toLowerCase().includes('gensulin')||m.name.toLowerCase().includes('insulin')){
   full+=`আপনার ইন্সুলিন নেয়ার সময় হয়েছে, ${m.when} ${m.name} নিয়ে নিন। `;
  } else {
   full+=`${m.when} ${m.name} ${m.dose} খেয়ে নিন। `;
  }
 });
 full+='আল্লাহ হাফেজ, তাড়াতাড়ি সুস্থ হয়ে যাবেন।';
 let u=new SpeechSynthesisUtterance(full); u.lang='bn-BD'; u.rate=0.85; speechSynthesis.speak(u);
}

function startAutoVoice(){
 document.getElementById('alarmStatus').innerHTML='✅ অটো ভয়েস চালু - প্রতি ঘন্টায় সময় হলে নিজে বলে দিবে';
 setInterval(()=>{let h=new Date().getHours(); if([8,13,21].includes(h)){speakProfessional();}}, 3600000);
 speakProfessional();
}

async function scan(input){
 let file=input.files[0]; let r=document.getElementById('report'); r.innerHTML='⏳ AI পড়ছে...';
 let {data:{text}} = await Tesseract.recognize(file,'eng'); let t=text.toLowerCase(); let d="রিপোর্টে সমস্যা আছে, ডাক্তারকে দেখান";
 if(t.includes('sugar')||t.includes('hba1c')) d="ডায়াবেটিস - সুগার বেশি"; else if(t.includes('creatinine')) d="কিডনি সমস্যা"; else if(t.includes('cbc')||t.includes('hemoglobin')) d="রক্তস্বল্পতা"; else if(t.includes('cholesterol')) d="কোলেস্টেরল বেশি";
 r.innerHTML='🔴 রোগ: '+d;
}

render();
</script>
</body>
</html>
