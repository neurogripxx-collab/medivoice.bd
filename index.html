<html>
<head>
  <title>medivoice.bd</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:sans-serif;background:#f8fbff;margin:0;padding:15px}
    #q{width:90%;max-width:360px;padding:12px 16px;border-radius:25px;border:1px solid #ddd;display:block;margin:20px auto;outline:none}
    #list{max-width:360px;margin:0 auto}
    #list div{padding:10px;background:#fff;margin:3px 0;border-radius:10px;text-align:center}
  </style>
</head>
<body>

<input id="q" placeholder="ওষুধ খুঁজুন..." autocomplete="off">
<div id="list"></div>

<script>
let meds = JSON.parse(localStorage.getItem('meds') || '["Napa 500","Napa Extra","Seclo 20","Fexo 120","Azithrocin 500","Entacyd Plus","Maxpro 20","Montair 10"]');
let q = document.getElementById('q'), list = document.getElementById('list');

q.addEventListener('input', ()=>{
  let v = q.value.trim().toLowerCase();
  if(!v){list.innerHTML="";return}
  let f = meds.filter(m=>m.toLowerCase().includes(v)).slice(0,6);
  list.innerHTML = f.map(m=>`<div onclick="q.value='${m}';list.innerHTML=''">${m}</div>`).join('');
});

q.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    let v = q.value.trim();
    if(v && !meds.some(m=>m.toLowerCase()===v.toLowerCase())){
      meds.push(v);
      localStorage.setItem('meds', JSON.stringify(meds));
    }
    list.innerHTML="";
  }
});
</script>

</body>
</html>
