<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medivoice.bd - SGH Prescription Pad</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#e9eef5}
.header{background:#fff;padding:12px 18px;border-bottom:2px solid #0b5ed7;font-weight:800;color:#0b5ed7}
.pad{max-width:920px;margin:12px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.sec{padding:14px;border-bottom:1px solid #eee}
.search{width:100%;padding:12px;border:1.5px solid #0b5ed7;border-radius:10px;outline:none}
.item{padding:8px;background:#f5f8ff;margin:3px 0;border-radius:8px;cursor:pointer}
.c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#f8fbff;padding:12px;border-radius:12px;border:1px solid #dce6ff}
</style>
</head>
<body>
<div class="header">Medivoice.bd • Digital Prescription • SGH Style</div>

<div class="pad">
<div class="sec" style="display:flex;justify-content:space-between"><b>Digital Prescription RX-2026-147</b><span>28 Sep 2026</span></div>

<div class="c sec">
<div class="card">
<h4>💊 ১. মেডিসিন লিস্ট - তোর ১০০০ লিস্ট</h4>
<input id="q" class="search" placeholder="Napa লিখো - না থাকলে Enter চাপো, অটো যোগ হবে">
<div id="list"></div>
<table style="width:100%;margin-top:8px;font-size:13px"><tbody id="rxbody"></tbody></table>
</div>

<div class="card">
<h4>🧪 ২. রিপোর্ট চেক - শুধু রোগ বলবে</h4>
<label style="display:block;background:#fff;padding:10px;border:2px dashed #f59e0b;border-radius:10px;text-align:center">📷 রিপোর্টের ছবি দাও<input type="file" hidden accept="image/*" onchange="scan(this)"></label>
<div id="report" style="margin-top:8px;font-weight:bold"></div>
</div>
</div>

<div class="sec card" style="margin:12px;background:#ecfdf5;border-color:#10b981">
<h4>⏰ ৩. এলার্ম - ওষুধ খাওয়ার রিমাইন্ডার</h4>
<div style="display:flex;gap:6px"><input id="alarmMed" placeholder="কোন ওষুধ?" style="flex:1;padding:8px"><input id="alarmTime" type="time" style="padding:8px"><button onclick="setAlarm()" style="background:#059669;color:#fff;border:none;padding:8px 12px;border-radius:8px">SET</button></div>
<div id="alarmList" style="margin-top:8px;font-size:13px">কোনো এলার্ম নাই</div>
</div>

</div>

<script>
let meds=JSON.parse(localStorage.getItem('meds')||'["Napa 500mg","Seclo 20mg","Fexo 120mg","Azithrocin 500mg","Entacyd Plus","Maxpro 20mg","Montair 10mg","Losectil 20mg"]');
let q=document.getElementById('q'), list=document.getElementById('list'), rxbody=document.getElementById('rxbody');
q.addEventListener('input',()=>{let v=q.value.toLowerCase();if(!v){list.innerHTML='';return}let f=meds.filter(m=>m.toLowerCase().includes(v)).slice(0,6);list.innerHTML=f.map(m=>`<div class="item" onclick="addMed('${m}')">${m}</div>`).join('');});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){let v=q.value.trim();if(!v)return;if(!meds.some(m=>m.toLowerCase()===v.toLowerCase())){meds.push(v);localStorage.setItem('meds',JSON.stringify(meds));}addMed(v);}});
function addMed(m){rxbody.innerHTML+=`<tr><td>💊 ${m}</td><td>1+0+1</td><td><span onclick="this.parentElement.parentElement.remove()" style="color:red">✕</span></td></tr>`;list.innerHTML='';q.value='';}

async function scan(input){
 let file=input.files[0]; let r=document.getElementById('report'); r.innerHTML='⏳ AI পড়ছে...';
 let {data:{text}} = await Tesseract.recognize(file,'eng'); let t=text.toLowerCase(); let d="রিপোর্টে সমস্যা - ডাক্তারকে দেখান";
 if(t.includes('sugar')||t.includes('glucose')||t.includes('hba1c')) d="ডায়াবেটিস - সুগার বেশি";
 else if(t.includes('creatinine')) d="কিডনি - Creatinine বেশি";
 else if(t.includes('hemoglobin')||t.includes('cbc')) d="রক্তস্বল্পতা";
 else if(t.includes('cholesterol')) d="কোলেস্টেরল বেশি";
 r.innerHTML='🔴 রোগ: '+d; let u=new SpeechSynthesisUtterance(d); u.lang='bn-BD'; speechSynthesis.speak(u);
}

let alarms=[];
function setAlarm(){
 let m=document.getElementById('alarmMed').value, tm=document.getElementById('alarmTime').value;
 if(!m||!tm)return alert('ওষুধ আর টাইম দাও');
 alarms.push({m,tm}); document.getElementById('alarmList').innerHTML=alarms.map(a=>`⏰ ${a.tm} - ${a.m}`).join('<br>');
 setInterval(()=>{let now=new Date().toTimeString().slice(0,5); alarms.forEach(a=>{if(a.tm===now){let u=new SpeechSynthesisUtterance(`${a.m} খাওয়ার সময় হয়েছে`);u.lang='bn-BD';speechSynthesis.speak(u);alert(a.m+' খাওয়ার সময়!');}});},60000);
}
</script>
</body>
</html>
